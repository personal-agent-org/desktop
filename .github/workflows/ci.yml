name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Install desktop build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-bin
      - name: Generate icons
        run: |
          cd crates/pagui
          for size in 32 128 256 512; do
            rsvg-convert -w "$size" -h "$size" app-icon.svg -o "icons/${size}x${size}.png"
          done
          cp icons/256x256.png icons/128x128@2x.png
          cp icons/512x512.png icons/icon.png
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo build --release -p pagui
