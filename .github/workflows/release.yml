name: Release

on:
  workflow_dispatch:
    inputs:
      minor:
        description: "MINOR version within this month; leave empty to continue from the tags"
        required: false

permissions:
  contents: write
  id-token: write

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  version:
    runs-on: ubuntu-latest
    outputs:
      value: ${{ steps.calver.outputs.value }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Compute CalVer
        id: calver
        run: |
          prefix="$(date -u +%Y).$(date -u +%-m)"
          minor="${{ github.event.inputs.minor }}"
          if [ -z "$minor" ]; then
            last=-1
            for tag in $(git tag -l "${prefix}.*"); do
              number="${tag##${prefix}.}"
              case "$number" in ''|*[!0-9]*) continue ;; esac
              [ "$number" -gt "$last" ] && last="$number"
            done
            minor=$((last + 1))
          fi
          case "$minor" in ''|*[!0-9]*) echo "MINOR must be numeric" >&2; exit 1 ;; esac
          echo "value=${prefix}.${minor}" >> "$GITHUB_OUTPUT"

  bundle-linux:
    needs: [ci, version]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Install bundle dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-bin librsvg2-dev
      - name: Generate icons
        run: |
          cd crates/pagui
          for size in 32 128 256 512; do
            rsvg-convert -w "$size" -h "$size" app-icon.svg -o "icons/${size}x${size}.png"
          done
          cp icons/256x256.png icons/128x128@2x.png
          cp icons/512x512.png icons/icon.png
      - uses: taiki-e/install-action@v2
        with:
          tool: tauri-cli
      - name: Set bundle version
        env:
          VERSION: ${{ needs.version.outputs.value }}
        run: |
          jq --arg version "$VERSION" '.version = $version' \
            crates/pagui/tauri.conf.json > crates/pagui/tauri.conf.json.tmp
          mv crates/pagui/tauri.conf.json.tmp crates/pagui/tauri.conf.json
      - uses: tauri-apps/tauri-action@v1
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"
          NO_STRIP: "true"
        with:
          projectPath: crates/pagui
          tauriScript: cargo tauri
      - name: Stage bundles
        run: |
          appimage=$(find target -type f -name "*.AppImage" | head -1)
          deb=$(find target -type f -name "*.deb" | head -1)
          test -n "$appimage"
          test -n "$deb"
          mkdir dist
          cp "$appimage" dist/pagui-linux-x64.AppImage
          cp "$deb" dist/pagui-linux-x64.deb
      - uses: actions/upload-artifact@v4
        with:
          name: linux-bundles
          path: dist/*

  release:
    needs: [version, bundle-linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v4
        with:
          name: linux-bundles
          path: dist
      - uses: sigstore/cosign-installer@v4.1.2
      - name: Sign and publish
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.value }}
        run: |
          (cd dist && sha256sum pagui-* > SHA256SUMS)
          cosign sign-blob --yes --bundle dist/SHA256SUMS.sigstore.json dist/SHA256SUMS
          git tag "$VERSION"
          git push origin "$VERSION"
          gh release create "$VERSION" --title "$VERSION" --generate-notes \
            dist/pagui-linux-x64.AppImage dist/pagui-linux-x64.deb \
            dist/SHA256SUMS dist/SHA256SUMS.sigstore.json
